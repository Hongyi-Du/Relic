schema_version: relic-paper-results-source-v1
paper:
  title: "Relic: From Multi-Agent Collaboration to Organizational Capability"
  status: ICLR 2027 under review
  snapshot_date: "2026-09-18"
  source_pdf_sha256: 3a7d4a6353d640a6e58508fc03125c99a5990992b60add04fa2ddbf56506ec2e

main_study:
  runs: 240
  models:
    - name: GPT-5.6 Terra
      runs: 120
      reasoning_effort: low
    - name: Claude Opus 4.6
      runs: 120
      reasoning_effort: low
  workloads: 10
  workload_inventory:
    - id: W01
      paper_label: Mini Blobstore
      frozen_pack_id: mini_blobstore_v1
      family: construction
      scoring_units: {seeded: 5, exposed: 35, held_out: 0, contracts: 5, cases: 35}
      status: main study + case
      manifest_ref: benchmarks/relic-main-v1/packs/mini_blobstore_v1/manifest.yaml
    - id: W02
      paper_label: Traffic Watch
      frozen_pack_id: traffic_watch_v1
      family: construction
      scoring_units: {seeded: 7, exposed: 7, held_out: 2, contracts: 9, cases: 40}
      status: main study
      manifest_ref: benchmarks/relic-main-v1/packs/traffic_watch_v1/manifest.yaml
    - id: W03
      paper_label: TG Automation
      frozen_pack_id: tg_automation_v1
      family: construction
      scoring_units: {seeded: 7, exposed: 7, held_out: 2, contracts: 9, cases: 9}
      status: main study
      manifest_ref: benchmarks/relic-main-v1/packs/tg_automation_v1/manifest.yaml
    - id: W04
      paper_label: PDF Reformatter
      frozen_pack_id: pdf_reformatter_v1
      family: construction
      scoring_units: {seeded: 3, exposed: 3, held_out: 1, contracts: 4, cases: 4}
      status: main study
      manifest_ref: benchmarks/relic-main-v1/packs/pdf_reformatter_v1/manifest.yaml
    - id: W05
      paper_label: FastAPI Dashboard
      frozen_pack_id: fastapi_dashboard_v1
      family: construction
      scoring_units: {seeded: 3, exposed: 3, held_out: 1, contracts: 4, cases: 4}
      status: main study
      manifest_ref: benchmarks/relic-main-v1/packs/fastapi_dashboard_v1/manifest.yaml
    - id: W06
      paper_label: Boltons 24.0.0 to 26.1.0
      frozen_pack_id: boltons_v2400_to_v2610
      family: repair
      scoring_units: {seeded: 12, exposed: 12, held_out: 4, contracts: 16, cases: 16}
      status: main study
      manifest_ref: benchmarks/relic-main-v1/packs/boltons_v2400_to_v2610/manifest.yaml
    - id: W07
      paper_label: Celery 5.6.0 to 5.6.3
      frozen_pack_id: celery_v560_to_v563
      family: repair
      scoring_units: {seeded: 12, exposed: 12, held_out: 4, contracts: 16, cases: 16}
      status: main study
      manifest_ref: benchmarks/relic-main-v1/packs/celery_v560_to_v563/manifest.yaml
    - id: W08
      paper_label: Soup Sieve 2.6 to 2.9.1
      frozen_pack_id: soupsieve_v26_to_v291
      family: repair
      scoring_units: {seeded: 9, exposed: 9, held_out: 4, contracts: 13, cases: 13}
      status: main study
      manifest_ref: benchmarks/relic-main-v1/packs/soupsieve_v26_to_v291/manifest.yaml
    - id: W09
      paper_label: cattrs 25.1.0 to 26.1.0
      frozen_pack_id: cattrs_v2510_to_v2610
      family: repair
      scoring_units: {seeded: 12, exposed: 12, held_out: 4, contracts: 16, cases: 16}
      status: main study
      manifest_ref: benchmarks/relic-main-v1/packs/cattrs_v2510_to_v2610/manifest.yaml
    - id: W10
      paper_label: Tenacity 8.2.3 to 9.1.4
      frozen_pack_id: tenacity_v823_to_v914
      family: repair
      scoring_units: {seeded: 12, exposed: 12, held_out: 4, contracts: 16, cases: 16}
      status: main study
      manifest_ref: benchmarks/relic-main-v1/packs/tenacity_v823_to_v914/manifest.yaml
  seeds: [1401, 2711, 4013]
  arms: [B0, B1, B2, B3]
  ticks: 336
  checkpoint_every: 24
  sprint_ticks: 168
  work_rhythm_enabled: false
  approval_mode: semi_auto
  resource_policy:
    matched_hard_budget: false
    realized_provider_tokens_measured: true
  evaluator_policy:
    allowed_backends: [docker, apptainer]
    trust_level: untrusted
    network_enabled: false
    platform: linux/amd64
    digest_pinned_image_required: true
    paper_runtime_image_environment_variable: ORG_EVALUATOR_CONTAINER_IMAGE
    provenance_scope: per_run_receipt
    receipt_fields:
      - execution_policy
      - evaluator_environment_hash
      - qualification_plan_hash
      - qualification_result_hash
    note: >-
      The paper does not claim one fixed backend or evaluator-environment hash
      for the complete 240-run matrix.
  aggregation: >-
    Average seeds within each model-by-workload block, then equally weight
    applicable blocks. B3-B2 intervals use 10,000 paired block-bootstrap
    replicates with seed 1729.
  metrics:
    - id: complete_contracts
      label: Complete contracts on mainline
      unit: percent
      direction: higher
      arms:
        B0: {value: 10.30, ci95: [5.1, 16.4]}
        B1: {value: 18.21, ci95: [10.9, 26.6]}
        B2: {value: 16.31, ci95: [10.3, 26.8]}
        B3: {value: 22.82, ci95: [14.6, 32.0]}
      b3_minus_b2: {value: 6.51, unit: percentage_points, ci95: [2.812, 10.517]}
    - id: held_out_cases
      label: Held-out cases on mainline
      unit: percent
      direction: higher
      arms:
        B0: {value: 10.29, ci95: [0.0, 35.5]}
        B1: {value: 12.25, ci95: [0.0, 31.3]}
        B2: {value: 13.86, ci95: [1.0, 46.1]}
        B3: {value: 24.51, ci95: [1.7, 65.3]}
      b3_minus_b2: {value: 10.65, unit: percentage_points, ci95: [2.041, 19.498]}
    - id: exposed_cases
      label: Exposed cases on mainline
      unit: percent
      direction: higher
      arms:
        B0: {value: 14.89, ci95: [7.2, 24.1]}
        B1: {value: 26.12, ci95: [14.9, 39.3]}
        B2: {value: 22.57, ci95: [15.0, 41.3]}
        B3: {value: 30.30, ci95: [17.9, 44.1]}
      b3_minus_b2: {value: 7.73, unit: percentage_points, ci95: [2.183, 13.016]}
    - id: evaluator_confirmed_seeded_issues
      label: Evaluator-confirmed seeded issues
      unit: percent
      direction: higher
      arms:
        B0: {value: 13.35, ci95: [6.5, 21.5]}
        B1: {value: 22.97, ci95: [13.1, 34.6]}
        B2: {value: 20.84, ci95: [12.2, 30.1]}
        B3: {value: 28.76, ci95: [17.4, 41.1]}
      b3_minus_b2: {value: 7.92, unit: percentage_points, ci95: [2.908, 14.409]}
    - id: average_tokens_per_run
      label: Average tokens per run
      unit: million_tokens
      direction: lower
      arms:
        B0: {value: 3.522, ci95: [3.350, 3.695]}
        B1: {value: 43.903, ci95: [40.745, 47.262]}
        B2: {value: 3.751, ci95: [3.439, 4.054]}
        B3: {value: 6.523, ci95: [5.119, 8.379]}
      b3_minus_b2: {value: 2.772, unit: million_tokens, ci95: [1.373, 4.665]}
    - id: tokens_per_confirmed_issue
      label: Tokens per evaluator-confirmed issue
      unit: million_tokens
      direction: lower
      arms:
        B0: {value: 4.947, ci95: [3.396, 5.963]}
        B1: {value: 31.760, ci95: [25.994, 46.592]}
        B2: {value: 2.907, ci95: [2.402, 4.632]}
        B3: {value: 3.651, ci95: [2.359, 6.660]}
      b3_minus_b2:
        value: -0.174
        unit: million_tokens
        ci95: [-1.686, 0.633]
        note: >-
          Paired contrast over 14 common nonzero blocks (42 pairs); it need not
          equal the difference between displayed arm means.

protocol_census:
  b3_runs: 60
  excludes_environment_seeded_protocol_ids: true
  counting_unit: protocol_lineage_within_run
  autonomous_proposal_lineages: 497
  currently_adopted_lineages: 393
  unadopted_proposal_lineages: 92
  subsequently_obsolete_lineages: 12
  ever_adopted_lineages: 405
  weak_or_strong_formed_lineages: 280
  weak_only_formed_lineages: 248
  strong_subset: 32
  top_three_families:
    review_and_merge: 108
    release_engineering: 80
    evidence_governance: 56
  top_three_share_of_formed: 0.871
  causal_claim: false

internal_transfer:
  model: GPT-5.6 Terra
  revision_source: User-supplied corrected complete internal-transfer table, 2026-09-18
  target_runs: 60
  text_runs: 30
  exec_runs: 30
  fresh_reference_runs_reused: 30
  primary_metric: behavioral_case_pass_rate
  arms:
    Fresh: {value: 25.4, unit: percent, ci95: [13.2, 41.1]}
    Text: {value: 34.6, unit: percent, ci95: [24.1, 46.4]}
    Exec: {value: 41.2, unit: percent, ci95: [23.4, 54.5]}
  contrasts:
    exec_minus_text: {value: 6.5, unit: percentage_points, ci95: [0.7, 15.6]}
    exec_minus_fresh: {value: 15.8, unit: percentage_points, ci95: [9.2, 31.8]}
  secondary_endpoint_metrics:
    - id: exposed_case_pass_rate
      label: Exposed-case pass rate
      unit: percent
      display_decimals: {Fresh: 3, Text: 1, Exec: 1}
      arms: {Fresh: 23.434, Text: 39.7, Exec: 44.4}
    - id: held_out_case_pass_rate
      label: Held-out-case pass rate
      unit: percent
      display_decimals: {Fresh: 3, Text: 1, Exec: 1}
      arms: {Fresh: 11.111, Text: 11.1, Exec: 25.9}
    - id: complete_contract_rate
      label: Complete-contract rate
      unit: percent
      display_decimals: {Fresh: 3, Text: 1, Exec: 1}
      arms: {Fresh: 18.574, Text: 31.5, Exec: 32.3}
    - id: workspace_behavioral_case_rate
      label: Workspace behavioral-case rate
      unit: percent
      display_decimals: {Text: 1, Exec: 1}
      arms: {Fresh: null, Text: 44.4, Exec: 51.0}
    - id: evaluator_confirmed_issue_rate
      label: Evaluator-confirmed issue rate
      unit: percent
      display_decimals: {Fresh: 3, Text: 1, Exec: 1}
      arms: {Fresh: 21.720, Text: 41.4, Exec: 45.1}
  secondary_endpoint_scope: >-
    Fresh complete-contract, exposed-case, held-out-case, and confirmed-issue
    rates use the full GPT-5.6 Terra B2 stratum. Text/Exec rates retain the
    transfer export. Fresh has no comparable workspace behavioral-case measure.
    These secondary point estimates do not carry new confidence intervals.
  process_metrics:
    - id: pull_requests_opened
      label: Pull requests opened, mean / run
      arms: {Fresh: 47.1, Text: 52.1, Exec: 48.8}
    - id: pull_requests_merged
      label: Pull requests merged, mean / run
      arms: {Fresh: 38.2, Text: 42.2, Exec: 39.7}
    - id: releases
      label: Releases, mean / run
      arms: {Fresh: 24.1, Text: 26.7, Exec: 26.2}
    - id: patches_generated_accepted
      label: Patches generated / accepted, mean / run
      arms:
        Fresh: {generated: 141.8, accepted: 110.0}
        Text: {generated: 124.7, accepted: 122.4}
        Exec: {generated: 118.0, accepted: 116.7}
    - id: file_edit_actions
      label: File-edit actions, mean / run
      arms: {Fresh: 141.9, Text: 121.0, Exec: 118.0}
    - id: total_actions
      label: Total actions, mean / run
      arms: {Fresh: 1389.3, Text: 1377.8, Exec: 1385.9}
    - id: imported_mechanisms
      label: Imported mechanisms, mean / run
      arms: {Fresh: 0, Text: 6.0, Exec: 6.0}
      annotations: {Text: text, Exec: executable}
    - id: new_target_mechanisms
      label: New target mechanisms, mean / run
      arms: {Fresh: 0, Text: 0, Exec: 0}
    - id: recorded_uses
      label: Recorded uses, mean / run
      arms: {Fresh: 0, Text: 0, Exec: 588.0}
    - id: recorded_binding_enforcements
      label: Recorded binding enforcements, mean / run
      arms: {Fresh: 0, Text: 0, Exec: 197.0}
    - id: amendments
      label: Amendments, mean / run
      arms: {Fresh: 0, Text: 0, Exec: 0}
  process_scope: All count-valued rows are means per complete run.
  cost_metrics:
    - id: average_tokens_per_run
      label: Average tokens per run
      unit: million_tokens
      scope: >-
        Separate nine-workload comparison: Fresh seed 2711 and Text/Exec seed
        1401, paired by workload; this is not a same-seed cost estimate.
      arms:
        Fresh: {value: 2.381, ci95: [1.747, 3.189]}
        Text: {value: 2.615, ci95: [2.213, 3.033]}
        Exec: {value: 2.448, ci95: [2.199, 2.720]}
      contrasts:
        exec_minus_fresh: {value: 0.067, ci95: [-0.569, 0.532]}
        exec_minus_text: {value: -0.167, ci95: [-0.467, 0.073]}
    - id: tokens_per_evaluated_case
      label: Tokens per evaluated case
      unit: thousand_tokens
      arms:
        Fresh: {value: 176, ci95: [106, 271]}
        Text: {value: 154, ci95: [96, 265]}
        Exec: {value: 144, ci95: [94, 243]}
      contrasts:
        exec_minus_fresh: {value: -32, ci95: [-112, 31]}
        exec_minus_text: {value: -10, ci95: [-33, 4]}
    - id: tokens_per_verified_pass
      label: Tokens per verified pass
      unit: thousand_tokens
      arms:
        Fresh: {value: 691, ci95: [488, 1419]}
        Text: {value: 444, ci95: [271, 935]}
        Exec: {value: 350, ci95: [196, 958]}
      contrasts:
        exec_minus_fresh: {value: -342, ci95: [-818, -14]}
        exec_minus_text: {value: -94, ci95: [-152, 54]}
  note: >-
    Text and Exec receive identical frozen rule content; Exec adds runtime
    bindings. Fresh reuses the 30 GPT-5.6 Terra B2 main-study runs.

binding_ablation:
  model: Claude Opus 4.6
  reasoning_effort: low
  new_b3_text_runs: 30
  matched_b3_runs_reused: 30
  metric: complete_contracts
  b3_text_percent: 15.03
  executable_b3_percent: 22.20
  executable_minus_text:
    value: 7.18
    unit: percentage_points
    ci95: [3.54, 10.91]
    bootstrap_replicates: 200000
  descriptive_endpoints:
    held_out_cases:
      b3_text_percent: 8.07
      executable_b3_percent: 36.98
      executable_minus_text_percentage_points: 28.91
    exposed_cases:
      b3_text_percent: 18.47
      executable_b3_percent: 32.52
      executable_minus_text_percentage_points: 14.04
    evaluator_confirmed_seeded_issues:
      b3_text_percent: 17.72
      executable_b3_percent: 29.44
      executable_minus_text_percentage_points: 11.71
  note: >-
    B3-text retains proposal, governance, adoption, revision, and readable
    rules while removing learned-protocol binding, automatic use credit, and
    protocol-specific enforcement.

external_extensions:
  cooperbench:
    subset: 48 feature pairs from 30 task instances and 12 repositories
    selection: blind-selected before inspecting compared-system outcomes
    reasoning_effort: high
    results:
      - {system: Relic B3-2, model: Claude Opus 4.6, successes: 29, total: 48}
      - {system: Official Solo, model: Claude Opus 4.6, successes: 26, total: 48}
      - {system: Official Peer, model: Claude Opus 4.6, successes: 13, total: 48}
      - {system: Team with protocol verbs, model: GPT-5.5-hao, successes: 26, total: 48}
      - {system: Team without protocol verbs, model: GPT-5.5-hao, successes: 24, total: 48}
      - system: OpenHands Cooperative, No Git
        model: GPT-5
        successes: 13
        total: 48
        supported_range: 13–15/48
        public_outcomes_missing: 2
        note: Current official cooperative leaderboard reference; not a same-model control.
    claim_boundary: >-
      The 48 pairs are not 48 independent samples, the selected subset was used
      during adapter development, and no statistical-superiority claim is made.
  programbench:
    reproduction_artifacts_included: false
    model: GPT-5.6 Terra
    tasks: 25
    official_mini_swe_agent_percent: 64.164
    with_executable_protocols_percent: 70.916
    absolute_gain_percentage_points: 6.752
    relative_gain_percent: 10.5
    sdl_enabled: false
    extension_scope: protocol_plugin_in_mini_swe_agent
    evidence_line: separate_from_main_study_and_internal_transfer
    tasks_at_or_above_95_percent:
      official_mini_swe_agent: 2
      with_executable_protocols: 2
    release_note: Results reported in the paper; code and artifacts are not included in this release.

hci:
  evidence_type: formative_interface_exploration
  interfaces: [P1 direct organization, P2 transparent liaison, P3 liaison-first interaction]
  claim_boundary: >-
    The appendix reports design and formative observations, not powered
    participant-study evidence, population estimates, or significance tests.

limitations:
  - B3 does not improve every workload; W01 is negative and W05 is zero on the named contrast.
  - ProgramBench has aggregate reporting only in this release.
  - Historical per-run author data and complete raw trajectories are not included.

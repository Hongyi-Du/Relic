entrypoints:
  cli:
    command:
    - python
    - -m
    - pytest
    - tests/public
    - -q
  smoke:
    command:
    - python
    - -m
    - pytest
    - tests/public
    - -q
public_tests:
  command:
  - python
  - -m
  - pytest
  - tests/public
  - -q
  # cattrs' pyproject sets addopts for pytest-benchmark, which is not in the
  # sandbox, so pytest exited on the arguments before collecting anything and
  # the organization's own gate reported an error every time it was run --
  # fifty-three times in one round, with the board still filling to 11/12.
  # Those flags belong to the project's benchmark suite, not to this gate.
  - -o
  - addopts=
  dependencies:
  - attrs>=24.3.0
  - typing-extensions>=4.12.2
  - exceptiongroup>=1.1.1; python_version < '3.11'
  - hypothesis>=6.111.2
  - pytest>=8.3.2
  - pytest-benchmark>=4.0.0
  - immutables>=0.20
  - coverage>=7.6.1
  - pytest-xdist>=3.6.1
hidden_tests:
  command:
  - python
  - -m
  - pytest
  - tests/hidden
  - -q
  dependencies:
  - attrs>=24.3.0
  - typing-extensions>=4.12.2
  - exceptiongroup>=1.1.1; python_version < '3.11'
  - hypothesis>=6.111.2
  - pytest>=8.3.2

entrypoints:
  cli:
    command:
    - python
    - -m
    - pytest
    - tests/public
    - -q
    - --confcutdir=tests/public
  smoke:
    command:
    - python
    - -m
    - pytest
    - tests/public
    - -q
    - --confcutdir=tests/public
# --confcutdir stops pytest loading tests/conftest.py, which the frozen 24.0.0
# starter carries and which declares pytest_ignore_collect(path, config). The
# path argument was removed in pytest 8, so on a modern runtime pluggy refuses
# the hook and collection dies before a single test runs. That conftest only
# skips test files named _pyX for a non-matching interpreter, and tests/public
# contains none, so not loading it changes nothing about what is measured.
#
# Without this the suite cannot start, every run_ci reports a contract break,
# no PR can merge, and a 336-tick run finishes with zero merges, zero releases
# and zero completed tasks — which reads as an organizational failure rather
# than a runtime that postdates the frozen repository by two years.
public_tests:
  command:
  - python
  - -m
  - pytest
  - tests/public
  - -q
  - --confcutdir=tests/public
  dependencies:
  - pytest
hidden_tests:
  command:
  - python
  - -m
  - pytest
  - tests/hidden
  - -q
  - --confcutdir=tests/hidden
  dependencies:
  - pytest
issue_stream:

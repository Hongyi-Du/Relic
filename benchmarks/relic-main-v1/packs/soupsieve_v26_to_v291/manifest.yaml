demand_shortfall_reason: The 2.6 -> 2.9.1 window contains 17 candidate changes and only 13 of them carry
  a behavior difference that a public-API contract can observe, so the Pack ships 13 contracts (9 public
  + 4 heldout) instead of 16. The four held-out demands were kept at full strength because they carry
  the transfer measurement; the shortfall was taken entirely on the public side, which drops from 12 to
  9. Four candidates were rejected for having no observable behavior difference at all (annotation-only
  typing changes, test-only accommodation for a stdlib parser change, the lazy-pattern-construction refactor
  and its two follow-ups, and two Python-version support-matrix changes). No demand was invented and no
  contract was weakened to reach a count.

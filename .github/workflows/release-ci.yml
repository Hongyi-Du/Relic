name: Relic release CI

on:
  push:
    # `main` is the release-focused source of truth. HCI, Cooper, and
    # full-tests have separate release/checklist responsibilities.
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relic-release-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  ubuntu-release:
    name: Ubuntu release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          enable-cache: false

      - name: Install the locked development environment
        run: uv sync --extra dev --frozen

      - name: Lint release source and tests
        # Benchmark packs are frozen research inputs, not Relic source. Ruff's
        # cache is disabled so it cannot alter a nested benchmark checkout.
        run: uv run ruff check --no-cache relic environments tests

      - name: Check the offline release CLI path
        # These commands are intentionally provider-free and do not invoke
        # Docker or the unavailable formal evaluator image.
        run: |
          uv run relic verify-benchmark
          uv run relic check-env --scope core
          uv run relic smoke --mode mock

      - name: Run the main release test suite
        # The public default excludes opt-in live/model, Docker, and slow
        # paths. Static release contracts for those boundaries still run.
        run: >-
          uv run pytest -q -m
          "not live and not llm and not slow and not docker"

      - name: Build wheel and source distribution
        run: uv build

  windows-wrapper-contracts:
    name: Windows PowerShell wrapper contracts
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify WSL-facing checkout policy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $attributes = Get-Content -LiteralPath .gitattributes -Raw
          if ($attributes -notmatch '(?m)^\*\.sh text eol=lf\r?$') {
            throw ".gitattributes must keep Bash launchers at LF"
          }
          $bashScripts = @(Get-ChildItem -LiteralPath scripts/bash -Filter *.sh -File)
          if ($bashScripts.Count -eq 0) {
            throw "No Bash launchers were found"
          }
          foreach ($script in $bashScripts) {
            $bytes = [System.IO.File]::ReadAllBytes($script.FullName)
            if ($bytes -contains 13) {
              throw "$($script.FullName) contains a CR line ending"
            }
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          enable-cache: false

      - name: Install the locked development environment
        run: uv sync --extra dev --frozen

      - name: Test PowerShell-to-WSL forwarding contracts
        # This parses and statically exercises the wrappers. It deliberately
        # does not invoke wsl.exe or claim a native-Windows Relic runtime.
        run: uv run pytest -q tests/test_powershell_wrappers.py

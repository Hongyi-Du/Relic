<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SocioGenesis · OrgEnv Live Inspector</title>
<!-- graph: Cytoscape.js + dagre (layered, draggable, click-to-focus) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape-dagre/2.5.0/cytoscape-dagre.min.js"></script>
<!-- code view: highlight.js (multi-language + auto-detect) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/atom-one-dark.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
<style>
:root{
  /* ATLAS design tokens: indigo + teal on a deep navy, 14px radius, soft deep shadows */
  --bg:#060a14; --bg2:#0b1222; --panel:#0f1729; --panel2:#16213a; --node-bg:#0f1a2e;
  --line:#1e293b; --line2:#283548; --text:#e2e8f0; --muted:#94a3b8; --faint:#64748b;
  --accent:#6366f1; --accent2:#2dd4bf; --cyan:#2dd4bf; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --pill:#14203a; --chip:#16213a; --glow:rgba(99,102,241,.5);
  --grad:linear-gradient(135deg,#6366f1,#8b5cf6);
  --grad2:linear-gradient(135deg,rgba(99,102,241,.18),rgba(45,212,191,.06));
  --radius:14px; --shadow:0 18px 48px -24px rgba(0,0,0,.8); --shadow-sm:0 8px 22px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;font:13px/1.55 "Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:
    radial-gradient(1200px 600px at 12% -10%,rgba(99,102,241,.12),transparent 60%),
    radial-gradient(1000px 500px at 100% 0%,rgba(45,212,191,.08),transparent 55%),
    var(--bg)}
h1,h2,h3,h4{margin:0;letter-spacing:.2px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26344a;border:2px solid transparent;background-clip:padding-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#33445f;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
button,select,input{font:inherit;color:var(--text);background:rgba(255,255,255,.03);border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s,transform .1s}
button:hover{border-color:var(--accent);background:rgba(99,102,241,.12);box-shadow:0 0 0 3px rgba(99,102,241,.10)}
button:active{transform:translateY(1px)}
input[type=number]{width:70px;cursor:text}
input[type=range]{accent-color:var(--accent)}
.btn-accent{background:var(--grad);color:#fff;border:none;font-weight:700;box-shadow:0 8px 20px -8px var(--glow)}
.btn-accent:hover{box-shadow:0 6px 20px var(--glow);filter:brightness(1.06)}
/* top bar */
.topbar{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;
  background:rgba(10,15,26,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.03),var(--shadow-sm)}
.brand{font-weight:800;letter-spacing:.2px;font-size:15px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock{font-variant-numeric:tabular-nums;background:var(--pill);padding:4px 11px;border-radius:8px;
  border:1px solid var(--line);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;
  box-shadow:0 0 0 0 var(--bad)}
.dot.run{background:var(--good);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,212,134,.5)}70%{box-shadow:0 0 0 7px rgba(70,212,134,0)}100%{box-shadow:0 0 0 0 rgba(70,212,134,0)}}
/* tabs */
.maintabs{display:flex;gap:2px;background:rgba(10,15,26,.5);border-bottom:1px solid var(--line);padding:0 14px}
.maintab{padding:11px 18px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:700;
  font-size:12.5px;letter-spacing:.3px;transition:color .15s,border-color .15s}
.maintab:hover{color:var(--text)}
.maintab.active{color:var(--text);border-bottom-color:var(--accent);
  text-shadow:0 0 18px var(--glow)}
.subnav{display:flex;gap:5px;flex-wrap:wrap;padding:9px 14px;background:rgba(10,15,26,.35);border-bottom:1px solid var(--line)}
.subnav .chip{padding:4px 12px;border-radius:20px;background:var(--chip);border:1px solid var(--line);cursor:pointer;
  color:var(--muted);font-size:12px;transition:all .15s}
.subnav .chip:hover{border-color:var(--line2);color:var(--text)}
.subnav .chip.active{background:var(--grad);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 6px 16px -6px var(--glow)}
.wrap{padding:12px 14px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .14s,border-color .14s,box-shadow .14s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--grad);opacity:.65}
.card .v{font-size:24px;font-weight:800;letter-spacing:.3px;line-height:1.25;
  background:linear-gradient(180deg,#fff,#bcd0f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-top:1px}
.card.clk{cursor:pointer}
.card.clk:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 1px var(--glow)}
/* agent grid */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.acard{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .14s,border-color .14s,box-shadow .14s}
.acard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 1px var(--glow)}
.acard .nm{font-weight:700}
.acard .cn{color:var(--muted);font-size:11px}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.06);margin:4px 0;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;box-shadow:0 0 8px rgba(0,0,0,.3) inset}
.mini{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
/* tables */
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
  position:sticky;top:0;background:rgba(15,23,36,.92);backdrop-filter:blur(6px);z-index:1}
tr:nth-child(even) td{background:rgba(255,255,255,.012)}
tr:hover td{background:rgba(99,102,241,.09)}
.clickrow{cursor:pointer}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--chip);border:1px solid var(--line);
  font-size:11px;margin:1px;font-weight:600}
.tag.good{background:rgba(52,211,153,.14);color:var(--good);border-color:rgba(52,211,153,.32)}
.tag.warn{background:rgba(251,191,36,.14);color:var(--warn);border-color:rgba(251,191,36,.32)}
.tag.bad{background:rgba(248,113,113,.14);color:var(--bad);border-color:rgba(248,113,113,.32)}
.tag.viz{background:rgba(99,102,241,.16);color:#a5b4fc;border-color:rgba(99,102,241,.34)}
.pillrow{display:flex;gap:4px;flex-wrap:wrap}
/* graph */
.graphwrap{position:relative;border:1px solid var(--line);border-radius:14px;height:440px;overflow:hidden;
  background:radial-gradient(900px 500px at 22% -6%,rgba(99,102,241,.10),transparent 60%),
    radial-gradient(700px 420px at 100% 0%,rgba(45,212,191,.06),transparent 55%),linear-gradient(160deg,#0b1322,#080d18);
  box-shadow:var(--shadow),inset 0 0 60px rgba(0,0,0,.45)}
svg{width:100%;height:100%;display:block}
.cy{width:100%;height:100%;display:block}
.gnode{cursor:pointer;transition:opacity .15s} .gnode circle{stroke:#05080e;stroke-width:1.4;transition:filter .15s}
.gnode:hover circle{filter:drop-shadow(0 0 6px var(--glow))}
.gnode text{font-size:9px;fill:var(--text);pointer-events:none}
.gnode.dim{opacity:.12} .gedge{stroke:#2c3a4f;stroke-width:1;transition:stroke .15s} .gedge.hot{stroke:var(--accent);stroke-width:2;filter:drop-shadow(0 0 4px var(--glow))}
.legend{position:absolute;top:8px;right:8px;background:rgba(8,12,20,.78);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11px;max-width:230px;box-shadow:var(--shadow-sm)}
.legend span{display:inline-block;margin:1px 5px 1px 0}
/* layout split */
.split{display:grid;grid-template-columns:1fr 360px;gap:12px}
.section{background:linear-gradient(160deg,var(--panel),rgba(22,33,47,.6));border:1px solid var(--line);
  border-radius:12px;padding:12px 13px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.section h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:8px;
  display:flex;align-items:center;gap:7px}
.section h3::before{content:"";width:3px;height:13px;border-radius:3px;background:var(--grad)}
.kv{font-size:12px;padding:3px 0;border-bottom:1px solid var(--line)} .kv b{color:var(--muted);font-weight:600}
.scroll{max-height:380px;overflow:auto}
.scroll-lg{max-height:560px;overflow:auto}
/* drawer */
.drawer{position:fixed;top:0;right:0;width:460px;height:100vh;border-left:1px solid var(--line2);
  background:linear-gradient(180deg,var(--panel),var(--bg2));
  transform:translateX(105%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:40;overflow:auto;padding:16px;
  box-shadow:-18px 0 40px rgba(0,0,0,.5)}
.drawer.open{transform:translateX(0)}
.drawer .x{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.drawer .x:hover{color:var(--text)}
.hide{display:none !important}
/* IDE-style full-screen file reader */
.reader{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column}
.reader.open{display:flex}
.reader-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.reader-bar .fname{font-weight:700;font-variant-ligatures:none}
.reader-body{flex:1;overflow:auto;display:flex;align-items:stretch;
  font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.reader-gutter{padding:12px 10px;text-align:right;color:#5b6675;background:var(--panel);
  user-select:none;border-right:1px solid var(--line);white-space:pre}
.reader-code{padding:12px 16px;white-space:pre;flex:1;color:var(--text);overflow:auto}
.reader-code .hljs{background:transparent;padding:0;font:inherit}
.reader-bar .lang{margin-left:6px;padding:2px 8px;border-radius:20px;background:var(--chip);border:1px solid var(--line);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:11px}
.scrubrow{display:flex;gap:8px;align-items:center;flex:1;min-width:280px}
#scrub{flex:1}
.flowstep{padding:3px 8px;background:var(--chip);border-radius:6px;margin:2px;display:inline-block}
.arrow{color:var(--accent);margin:0 4px}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">🔬 OrgEnv Inspector</span>
  <span class="clock" id="clock">tick — · day — · —:00 · —</span>
  <span id="runState"><span class="dot"></span>idle</span>
  <span class="row">
    <select id="sourceSel" title="data source"></select>
    <button onclick="simStep(1)">Step</button>
    <button onclick="simRun(10)">Run 10</button>
    <button onclick="simRun(24)">Run 24</button>
    <button onclick="simRun(72)">Run 3d</button>
    <button onclick="simPause()">Pause</button>
    <button onclick="simReset()">Reset</button>
    seed <input type="number" id="seedInput" value="42"/>
    <button onclick="exportReplay()">Export</button>
  </span>
  <span class="scrubrow">
    <button id="btnPlay" onclick="togglePlay()">▶</button>
    <input type="range" id="scrub" min="0" max="0" value="0" oninput="setFrame(+this.value)"/>
    <span class="clock" id="frameLabel">0/0</span>
  </span>
  <span class="row">
    view
    <select id="viewSel" onchange="S.view=this.value;render()">
      <option value="omniscient">Omniscient (debug)</option>
      <option value="agent_visible">Agent-visible</option>
    </select>
  </span>
</div>

<div class="maintabs">
  <div class="maintab active" id="tab-internal" onclick="setTab('internal')">Company Internal</div>
  <div class="maintab" id="tab-external" onclick="setTab('external')">External Network</div>
  <div class="maintab" id="tab-product" onclick="setTab('product')">🧪 Product Terminal</div>
</div>

<div id="content"></div>

<div class="drawer" id="drawer"><span class="x" onclick="closeDrawer()">✕</span><div id="drawerBody"></div></div>

<div class="reader" id="reader">
  <div class="reader-bar"><span class="fname" id="readerTitle">file</span>
    <span class="lang" id="readerLang"></span>
    <span class="muted" id="readerMeta"></span><span style="flex:1"></span>
    <button onclick="closeReader()">✕ close</button></div>
  <div class="reader-body"><div class="reader-gutter" id="readerGutter"></div><div class="reader-code" id="readerCode"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LIVE="__live__";
const S={frames:[],fi:0,mode:"live",tab:"internal",sub:"dashboard",agent:null,node:null,
  view:"omniscient",personaMode:"summary",curPersona:null,product:null,reader:null,
  live:false,liveTimer:null,liveLast:-1,playing:false,timer:null,speed:700};
const NODE_COLORS={agent:"#58a6ff",trait:"#bc8cff",skill:"#3fb950",failure_mode:"#f85149",routine:"#d29922",
  communication_style:"#79c0ff",state:"#ff9bce",policy_bias:"#ffa657",action_feature:"#56d4dd",task:"#3fb950",doc:"#79c0ff",file:"#56d4dd",
  message:"#d2a8ff",meeting:"#ffa657",pr:"#f0883e",commit:"#8b949e",result:"#3fb950",protocol:"#f778ba",
  commitment:"#a5d6ff",dispute:"#f85149",request:"#d29922",external_profile:"#ff7b72",external_post:"#7ee787",
  internal_agent:"#58a6ff",sandbox_job:"#8b949e",experiment:"#56d4dd",cost_event:"#d29922",action:"#3fb950",
  feature:"#56d4dd",speech:"#d2a8ff",risk:"#f85149",evidence:"#7ee787",cluster:"#ffa657"};
const SUBS_INTERNAL=["dashboard","product","episodes","reflections","llm","proposals","agents","tasks","docs","messages","meetings","repo","sandbox","budget","protocols","event graph"];
const SUBS_EXTERNAL=["dashboard","profiles","posts","signals","network","offers","flow"];

function frame(){return S.frames[S.fi]||null;}
async function getJSON(u){const r=await fetch(u);return r.json();}
async function postJSON(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});return r.json();}

/* ---------- data sources ---------- */
async function loadSources(){
  const sel=$("sourceSel");sel.innerHTML="";
  const lo=document.createElement("option");lo.value=LIVE;lo.textContent="● LIVE (running sim)";sel.appendChild(lo);
  try{const d=await getJSON("/api/org/lived/replays");(d.replays||[]).forEach(r=>{
    const o=document.createElement("option");o.value=r.name;o.textContent=`${r.name} (${(r.meta&&r.meta.ticks)||"?"}t)`;sel.appendChild(o);});}catch(e){}
  sel.value=LIVE;sel.onchange=()=>{sel.value===LIVE?startLive():loadReplay(sel.value);};
  startLive();
}
function startLive(){stopLive();pause();S.live=true;S.mode="live";S.liveLast=-1;S.frames=[];S.fi=0;
  pollLive();S.liveTimer=setInterval(pollLive,1500);}
function stopLive(){S.live=false;if(S.liveTimer){clearInterval(S.liveTimer);S.liveTimer=null;}}
async function pollLive(){if(!S.live)return;
  try{const d=await getJSON("/api/org/lived/frames?since="+S.liveLast);const fresh=d.frames||[];
    if(fresh.length){const wasEnd=S.fi>=S.frames.length-1;fresh.forEach(f=>S.frames.push(f));
      S.liveLast=S.frames[S.frames.length-1].tick;
      if(!S.agent){const ag=Object.keys(S.frames[S.frames.length-1].agents||{});S.agent=ag[0]||null;}
      $("scrub").max=Math.max(0,S.frames.length-1);if(wasEnd){S.fi=S.frames.length-1;}}
    setRunState(d.running);render();}catch(e){}}
/* incremental replay: reconstruct full frames from a base + per-tick deltas
   (mirrors environments/org_env/runtime_adapter/replay_delta.py). */
function applyDelta(prev,delta){
  if(delta==null)return prev;
  const op=delta[0];
  if(op==="=")return delta[1];
  if(op==="a")return (prev||[]).concat(delta[1]);
  if(op==="d"){const out=Object.assign({},prev||{});const patch=delta[1]||{};
    for(const k in patch)out[k]=applyDelta(out[k],patch[k]);
    for(const k of (delta[2]||[]))delete out[k];return out;}
  return delta.length>1?delta[1]:prev;}
function expandReplay(d){
  if(d&&(d.format==="org-delta-v1"||(d.base!==undefined&&d.deltas!==undefined))){
    if(d.base==null)return [];
    const frames=[d.base];let cur=d.base;
    for(const dl of (d.deltas||[])){cur=applyDelta(cur,dl);frames.push(cur);}
    /* keyframed heavy sections (graphs/logs/timeline) are carried forward so every
       frame still renders them (keyframe-fresh). */
    const keys=d.keyframe_keys||[];
    if(keys.length){const last={};
      for(const fr of frames){for(const k of keys){if(k in fr)last[k]=fr[k];else if(k in last)fr[k]=last[k];}}}
    return frames;}
  return (d&&d.frames)||[];}
async function loadReplay(name){stopLive();pause();S.mode="replay";
  const d=await getJSON("/api/org/lived/replay/"+name);S.frames=expandReplay(d);S.fi=Math.max(0,S.frames.length-1);
  const ag=Object.keys((S.frames[0]||{}).agents||{});S.agent=ag[0]||null;
  $("scrub").max=Math.max(0,S.frames.length-1);render();}

/* ---------- sim controls ---------- */
function setRunState(run){const e=$("runState");e.innerHTML=`<span class="dot ${run?'run':''}"></span>${run?'running':(S.mode==='replay'?'replay':'idle')}`;}
async function simStep(n){if(S.mode!=='live')startLive();await postJSON("/api/org/sim/step",{n});S.liveLast=-1;await refreshLive();}
async function simRun(n){if(S.mode!=='live')startLive();setRunState(true);await postJSON("/api/org/sim/run_ticks",{n});S.liveLast=-1;await refreshLive();}
async function simPause(){await postJSON("/api/org/sim/pause",{});setRunState(false);}
async function simReset(){const seed=+($("seedInput").value||42);await postJSON("/api/org/sim/reset",{seed});startLive();}
async function refreshLive(){const d=await getJSON("/api/org/lived/frames?since=-1");S.frames=d.frames||[];
  S.liveLast=S.frames.length?S.frames[S.frames.length-1].tick:-1;S.fi=S.frames.length-1;
  $("scrub").max=Math.max(0,S.frames.length-1);if(!S.agent){const ag=Object.keys((frame()||{}).agents||{});S.agent=ag[0]||null;}render();}
async function exportReplay(){const d=await postJSON("/api/org/sim/export",{name:"org_run_"+Date.now()});alert("Saved replay: "+(d.name||d.error));loadSources();}

/* ---------- scrubber ---------- */
function setFrame(i){S.fi=Math.max(0,Math.min(S.frames.length-1,i));$("scrub").value=S.fi;render();}
function togglePlay(){if(S.playing){pause();return;}S.playing=true;$("btnPlay").textContent="⏸";
  S.timer=setInterval(()=>{if(S.fi>=S.frames.length-1){pause();return;}setFrame(S.fi+1);},S.speed);}
function pause(){S.playing=false;$("btnPlay").textContent="▶";if(S.timer)clearInterval(S.timer);S.timer=null;}

/* ---------- tabs ---------- */
function setTab(t){S.tab=t;S.sub="dashboard";$("tab-internal").classList.toggle("active",t==="internal");
  $("tab-external").classList.toggle("active",t==="external");
  $("tab-product").classList.toggle("active",t==="product");render();}
function setSub(s){S.sub=s;render();}
function selAgent(a){S.agent=a;S.sub="agents";S.tab="internal";$("tab-internal").classList.add("active");$("tab-external").classList.remove("active");render();}

/* ---------- render root ---------- */
function render(){
  const f=frame();
  if(!f){$("content").innerHTML='<div class="wrap muted">waiting for a frame… click Step / Run.</div>';return;}
  $("clock").textContent=`tick ${f.tick} · day ${f.day} · ${String(f.hour).padStart(2,'0')}:00 · ${f.phase} · ${f.day_of_week||''}`;
  $("frameLabel").textContent=`${S.fi+1}/${S.frames.length}`;
  if($("scrub").value!=S.fi)$("scrub").value=S.fi;
  if(S.tab==="product"){$("content").innerHTML=`<div class="wrap" id="panel"></div>`;return renderProductTerminal(f,$("panel"));}

}

function renderInternal(f){

  if(S.sub==="proposals")return renderProposals(f,p);
  if(S.sub==="agents")return S.agent?renderAgentDetail(f,p):renderAgentGrid(f,p);
  if(S.sub==="tasks")return renderTasks(f,p);
  if(S.sub==="docs")return renderDocs(f,p);
  if(S.sub==="messages")return renderMessages(f,p);

const EP_COLORS={feedback_ingestion_episode:"#58a6ff",claim_dispute_episode:"#f85149",
  experiment_episode:"#3fb950",protocol_formation_episode:"#d2a8ff",launch_crunch_episode:"#ffa657",

function epName(f,a){return (f.agents[a]||{}).name||a;}
function renderEpisodes(f,p){
  const eb=f.episodes||{items:[],by_type:{},open_count:0,closed_count:0,total:0};
  const items=eb.items.slice().reverse();
  const filt=S._epFilter||"all";
  const types=Object.keys(eb.by_type||{});
  const shown=items.filter(e=>filt==="all"||e.episode_type===filt);
  const head=`<div class="cards">${card("episodes",eb.total)}${card("open",eb.open_count)}${card("closed",eb.closed_count)}</div>
    <div class="row" style="margin:8px 0"><span class="muted">filter:</span>
      <span class="chip ${filt==='all'?'active':''}" onclick="S._epFilter='all';render()">all</span>
      ${types.map(t=>`<span class="chip ${filt===t?'active':''}" onclick="S._epFilter='${t}';render()">${esc(t.replace('_episode',''))} (${eb.by_type[t]})</span>`).join("")}</div>`;
  const cards=shown.map(e=>{
    const c=EP_COLORS[e.episode_type]||"#8b949e";
    const linked=(e.linked_object_ids||[]).length;
    const st=e.status==="resolved"?"good":(e.status==="open"?"warn":"");
    return `<div class="section" style="border-left:3px solid ${c};cursor:pointer" onclick='openEpisode("${e.episode_id}")'>
      <div class="row" style="justify-content:space-between"><b>${esc(e.title||e.episode_type)}</b>
        <span class="tag ${st}">${esc(e.status)}</span></div>
      <div class="muted" style="font-size:11px">${esc(e.episode_type)} · t${e.start_tick}${e.end_tick!=null?`→${e.end_tick}`:'→…'} · ${linked} objects · ${(e.participants||[]).length} ppl</div>
      <div class="kv" style="margin-top:4px">${esc(e.problem_statement||'')}</div>
      <div class="pillrow" style="margin-top:4px">${(e.participants||[]).map(a=>`<span class="tag">${esc(epName(f,a))}</span>`).join("")}</div>
      ${e.outcome_summary?`<div class="muted" style="font-size:11px;margin-top:4px">${esc(e.outcome_summary)}</div>`:''}
    </div>`;}).join("")||'<div class="muted">no episodes yet — run more ticks</div>';
  p.innerHTML=head+cards;
}
function openEpisode(eid){
  const f=frame();const e=((f.episodes||{}).items||[]).find(x=>x.episode_id===eid);
  if(!e){drawerKV("Episode "+eid,{note:"not found"});return;}
  const objRow=o=>`<span class="tag clk" onclick="openObj('${o}')" style="cursor:pointer">${esc(o)}</span>`;
  const sec=(t,arr)=>arr&&arr.length?`<div class="section"><h3>${t} (${arr.length})</h3><div class="pillrow">${arr.map(objRow).join("")}</div></div>`:'';
  let h=`<h3>${esc(e.title||e.episode_type)} <span class="tag ${e.status==='resolved'?'good':(e.status==='open'?'warn':'')}">${esc(e.status)}</span></h3>
    <div class="section">
      <div class="kv"><b>type</b>: ${esc(e.episode_type)}</div>
      <div class="kv"><b>ticks</b>: ${e.start_tick} → ${e.end_tick!=null?e.end_tick:'(open)'}</div>
      <div class="kv"><b>primary</b>: ${esc(epName(f,e.primary_agent_id))}</div>
      <div class="kv"><b>participants</b>: ${(e.participants||[]).map(a=>esc(epName(f,a))).join(", ")}</div>
      <div class="kv"><b>trigger</b>: ${esc(e.trigger_object_id||e.trigger_event_id||'—')}</div>
    </div>
    <div class="section"><h3>Problem</h3><div class="kv">${esc(e.problem_statement||'—')}</div>
      ${e.conflict_summary?`<div class="kv"><b>conflict</b>: ${esc(e.conflict_summary)}</div>`:''}
      ${e.decision_summary?`<div class="kv"><b>decision</b>: ${esc(e.decision_summary)}</div>`:''}
      ${e.outcome_summary?`<div class="kv"><b>outcome</b>: ${esc(e.outcome_summary)}</div>`:''}</div>`;
  h+=sec("Produced artifacts",e.produced_artifacts)+sec("Produced protocols",e.produced_protocols)
    +sec("Produced tasks",e.produced_tasks)+sec("Product changes",e.produced_product_changes);
  h+=sec("Tasks",e.linked_task_ids)+sec("Docs",e.linked_doc_ids)+sec("Messages",e.linked_message_ids)
    +sec("Meetings",e.linked_meeting_ids)+sec("Repo",e.linked_repo_ids)
    +sec("Sandbox/results",e.linked_sandbox_result_ids)+sec("Protocols",e.linked_protocol_ids)
    +sec("External signals",e.linked_external_signal_ids);
  if(e.linked_reflection_ids&&e.linked_reflection_ids.length)
    h+=`<div class="section"><h3>Reflections produced</h3><div class="pillrow">${e.linked_reflection_ids.map(r=>`<span class="tag clk" style="cursor:pointer" onclick="openReflection('${r}')">${esc(r)}</span>`).join("")}</div></div>`;
  if(e.linked_wish_ids&&e.linked_wish_ids.length)
    h+=`<div class="section"><h3>Wishes</h3><div class="pillrow">${e.linked_wish_ids.map(w=>`<span class="tag clk" style="cursor:pointer" onclick="openWish('${w}')">${esc(w)}</span>`).join("")}</div></div>`;
  if(e.related_episode_ids&&e.related_episode_ids.length)
    h+=`<div class="section"><h3>Related episodes</h3><div class="pillrow">${e.related_episode_ids.map(r=>`<span class="tag clk" style="cursor:pointer" onclick="openEpisode('${r}')">${esc(r)}</span>`).join("")}</div></div>`;
  if(e.timeline&&e.timeline.length)
    h+=`<div class="section"><h3>Timeline (${e.timeline.length})</h3><div class="scroll">${e.timeline.map(t=>`<div class="kv"><b>t${t.tick}</b> ${esc(t.family)}${t.subtype?'/'+esc(t.subtype):''} <span class="muted">${esc(epName(f,t.actor_id))}</span> ${(t.object_ids||[]).slice(0,3).map(o=>`<code>${esc(o)}</code>`).join(" ")}</div>`).join("")}</div></div>`;
  h+=`<div class="section"><h3>state_delta</h3>${kvBlock(e.state_delta||{})}</div>`;
  $("drawerBody").innerHTML=h;$("drawer").classList.add("open");
}

  const head=`<div class="cards">${card("reflections",rb.total)}${card("wishes",wb.total)}${card("agents reflecting",Object.keys(rb.by_agent||{}).length)}</div>
    <div class="row" style="margin:8px 0"><span class="muted">Reflection → Wish chain. Click a wish to see its source reflection excerpt.</span></div>`;

    (wishes.map(w=>{const c=WISH_COLORS[w.wish_type]||"#8b949e";

/* ====================== SVG FORCE GRAPH (zoom + pan) ====================== */
const ZOOM={};  // svgId -> {k,x,y,user}
function hashf(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return((h>>>0)%1000)/1000;}
function layout(nodes,edges,W,H){
  const N=nodes.slice(0,200),idset=new Set(N.map(n=>n.id));
  const E=edges.filter(e=>idset.has(e.src)&&idset.has(e.dst));
  const pos={};N.forEach(n=>{const a=hashf(n.id)*6.283,r=80+hashf(n.id+"r")*Math.min(W,H)*0.42;pos[n.id]={x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,vx:0,vy:0};});
  const k=Math.sqrt((W*H)/Math.max(1,N.length))*1.15,it=Math.min(300,120+N.length);
  for(let t=0;t<it;t++){const cool=1-t/it;
    for(let i=0;i<N.length;i++){const a=pos[N[i].id];for(let j=i+1;j<N.length;j++){const b=pos[N[j].id];
      let dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy)||0.01;const f=(k*k)/(d*d)*14,fx=dx/d*f,fy=dy/d*f;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}}
    E.forEach(e=>{const a=pos[e.src],b=pos[e.dst];let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||0.01;const f=(d-k)*0.018,fx=dx/d*f,fy=dy/d*f;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;});
    N.forEach(n=>{const p=pos[n.id];p.vx+=(W/2-p.x)*0.002;p.vy+=(H/2-p.y)*0.002;p.x+=Math.max(-30,Math.min(30,p.vx))*cool;p.y+=Math.max(-30,Math.min(30,p.vy))*cool;p.vx*=0.86;p.vy*=0.86;});}
  return {pos,N,E};
}
function applyTransform(svgId){const z=ZOOM[svgId];const g=$(svgId+"__g");if(g&&z)g.setAttribute("transform",`translate(${z.x},${z.y}) scale(${z.k})`);}
function fitTransform(bb,W,H){const bw=Math.max(1,bb.maxx-bb.minx),bh=Math.max(1,bb.maxy-bb.miny);
  const k=Math.max(.12,Math.min(2.2,Math.min(W/(bw+80),H/(bh+80))));
  return {k,x:W/2-(bb.minx+bw/2)*k,y:H/2-(bb.miny+bh/2)*k,user:false};}
function attachZoom(svg,svgId,W,H){
  svg.onwheel=e=>{e.preventDefault();const z=ZOOM[svgId];const r=svg.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;const f=e.deltaY<0?1.12:1/1.12;const nk=Math.max(.06,Math.min(6,z.k*f));
    z.x=mx-(mx-z.x)*(nk/z.k);z.y=my-(my-z.y)*(nk/z.k);z.k=nk;z.user=true;applyTransform(svgId);};
  svg.onmousedown=e=>{if(e.target.closest(".gnode"))return;e.preventDefault();const z=ZOOM[svgId];
    const sx=e.clientX,sy=e.clientY,ox=z.x,oy=z.y;svg.style.cursor="grabbing";
    const mv=ev=>{z.x=ox+(ev.clientX-sx);z.y=oy+(ev.clientY-sy);z.user=true;applyTransform(svgId);};
    const up=()=>{svg.style.cursor="grab";window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);};
    window.addEventListener("mousemove",mv);window.addEventListener("mouseup",up);};
  svg.ondblclick=()=>{ZOOM[svgId].user=false;render();};
  svg.style.cursor="grab";
}

  if(risks.length)h+=`<div class="section"><h3>Risks</h3><div class="pillrow">${risks.map(a=>`<span class="tag bad">${esc(a)}</span>`).join("")}</div></div>`;
  if(feats.length)h+=`<div class="section"><h3>Policy features</h3><div class="pillrow">${feats.map(a=>`<span class="tag viz">${esc(a)}</span>`).join("")}</div></div>`;
  if(evRows.length)h+=`<div class="section"><h3>Evidence (behavioral)</h3>${evRows.slice(0,12).map(e=>`<div class="kv">${esc(e.label)}${e.strength!=null?` <span class="muted">str ${esc(e.strength)}</span>`:''}${e.event_type?` <i class="muted">[${esc(e.event_type)}${e.target?` · ${esc(e.target)}`:''}]</i>`:''}${e.reason?`<div class="muted" style="font-size:11px">${esc(e.reason)}</div>`:''}</div>`).join("")}</div>`;
  if(drivenBy.length)h+=`<div class="section"><h3>Driven by (${drivenBy.length})</h3>${drivenBy.slice(0,12).map(edgeRow).join("")}</div>`;
  if(outs.length)h+=`<div class="section"><h3>Outgoing (${outs.length})</h3>${outs.slice(0,14).map(edgeRow).join("")}</div>`;
  $("drawerBody").innerHTML=h;$("drawer").classList.add("open");
}

/* ====================== OBJECT DRAWER ====================== */
function findObject(id){const f=frame();if(!f)return null;
  const I=f.internal,X=f.external,R=I.repo;
  const banks=[["task",I.tasks,"task_id"],["doc",I.docs,"doc_id"],["file",I.files,"object_id"],["message",I.messages,"message_id"],
    ["meeting",I.meetings,"meeting_id"],["pr",R.pull_requests,"pr_id"],["commit",R.commits,"commit_id"],["branch",R.branches,"branch_id"],
    ["result",I.results,"result_id"],["experiment",I.experiments,"experiment_id"],["protocol",I.protocols,"protocol_id"],
    ["issue",I.issues,"issue_id"],
    ["commitment",I.commitments,"commitment_id"],["dispute",I.disputes,"dispute_id"],["request",I.requests,"request_id"],
    ["sandbox_job",I.sandbox.jobs,"job_id"],["cost_event",I.cost_events,"cost_event_id"],["ticket",I.tickets,"ticket_id"],
    ["external_profile",X.profiles,"external_agent_id"],["external_post",X.posts,"post_id"]];
  for(const [type,arr,key] of banks){const o=(arr||[]).find(x=>x[key]===id);if(o)return {type,obj:o};}
  return null;}
function openObj(id){const r=findObject(id);if(!r){drawerKV("Object "+id,{note:"not found in this frame"});return;}
  const f=frame();const edges=(f.graphs.event.edges||[]).filter(e=>e.src===id||e.dst===id);
  let html=`<h3>${esc(r.type)} · <code>${esc(id)}</code></h3>`;
  if(r.obj.visible_to_agents){const all=Object.keys(f.agents);
    html+=`<div class="section"><h3>Visibility</h3><div class="kv"><b>debug_visible</b>: yes</div>`+
      all.map(a=>`<div class="kv"><b>visible to ${esc(a)}</b>: ${(r.obj.visible_to_agents||[]).includes(a)?'<span class="tag good">yes</span>':'<span class="tag bad">no</span>'}</div>`).join("")+
      (r.obj.read_by?`<div class="kv"><b>read_by</b>: ${(r.obj.read_by||[]).join(', ')||'—'}</div>`:'')+
      (r.obj.private_owner?`<div class="kv"><b>private_owner</b>: ${esc(r.obj.private_owner)}</div>`:'')+`</div>`;}
  if(r.obj.lifecycle){html+=`<div class="section"><h3>Lifecycle</h3>${kvBlock(r.obj.lifecycle)}</div>`;}
  if(r.obj.internal_exposure){html+=`<div class="section"><h3>Internal exposure</h3>${kvBlock(r.obj.internal_exposure)}</div>`;}
  if(r.obj.provenance){html+=`<div class="section"><h3>Provenance</h3>${kvBlock(r.obj.provenance)}</div>`;}
  if(r.obj.event_chain){html+=`<div class="section"><h3>Event chain</h3>${(r.obj.event_chain||[]).map(e=>`<div class="kv"><b>t${e.tick}</b> ${esc(e.event_type)} by ${esc(e.actor_id||'')}</div>`).join("")}</div>`;}
  html+=`<div class="section"><h3>Fields</h3>`+Object.entries(r.obj).filter(([k])=>!["visible_to_agents","read_by","lifecycle","internal_exposure","provenance","event_chain","debug_visible"].includes(k)).map(([k,v])=>`<div class="kv"><b>${esc(k)}</b>: ${esc(typeof v==='object'?JSON.stringify(v):v)}</div>`).join("")+`</div>`;
  html+=`<div class="section"><h3>Linked event-graph edges (${edges.length})</h3>${edges.map(e=>`<div class="kv">${esc(e.src)} <i class="muted">${esc(e.type)}</i> → ${esc(e.dst)}</div>`).join("")||'<div class="muted">none</div>'}</div>`;
  $("drawerBody").innerHTML=html;$("drawer").classList.add("open");}
/* file content viewer — shows what's actually INSIDE a workspace/company file
   (content_summary + raw_payload), not just its metadata fields. */
function findFile(id){const f=frame();if(!f)return null;
  for(const fo of (f.internal&&f.internal.files||[]))if(fo.object_id===id)return fo;
  for(const ag of Object.values(f.agents||{}))for(const fo of ((ag.workspace||{}).local_files||[]))if(fo.object_id===id)return fo;
  for(const d of (f.internal&&f.internal.docs||[]))if(d.doc_id===id)return d;
  return null;}
function fileContentHTML(fo){let body="";
  const summ=fo.content_summary||fo.summary||fo.body_summary;
  if(summ)body+=`<div class="section"><h3>Summary</h3><div class="kv">${esc(summ)}</div></div>`;
  const rp=(fo.raw_payload!=null)?fo.raw_payload:(fo.body!=null?fo.body:fo.content);
  if(rp!=null){const txt=typeof rp==="string"?rp:JSON.stringify(rp,null,2);
    body+=`<div class="section"><h3>Content</h3><pre style="white-space:pre-wrap;font-size:11px;max-height:440px;overflow:auto;background:var(--panel2);padding:8px;border-radius:6px">${esc(txt)}</pre></div>`;}
  if(!body)body='<div class="muted">no stored content (summary/payload empty)</div>';
  return body;}
function openFile(id){const fo=findFile(id);if(!fo){drawerKV("File "+id,{note:"not found in this frame (may be a draft id not yet materialised)"});return;}
  const meta={owner:fo.owner_id||fo.creator_id,type:fo.file_type||fo.doc_type,visibility:fo.visibility,version:fo.version,
    review_status:fo.review_status||fo.status,trust_level:fo.trust_level,created_tick:fo.created_tick,last_modified_tick:fo.last_modified_tick};
  const rp=(fo.raw_payload!=null)?fo.raw_payload:(fo.body!=null?fo.body:fo.content);
  const bodyText=(typeof rp==="string")?rp:(rp!=null?JSON.stringify(rp,null,2):(fo.content_summary||fo.summary||""));
  S.reader={title:(fo.title||id),meta:`${fo.file_type||fo.doc_type||'file'} · v${fo.version||1}`,text:bodyText};
  $("drawerBody").innerHTML=`<h3>file · <code>${esc(id)}</code></h3><h2 style="margin:4px 0 6px">${esc(fo.title||'')}</h2>`+
    `<button class="btn-accent" onclick="openReaderStashed()" style="margin-bottom:8px">▶ View file</button>`+
    `<div class="section"><h3>Meta</h3>${kvBlock(meta)}</div>`+fileContentHTML(fo)+
    (fo.visible_to_agents?`<div class="section"><h3>Visible to</h3><div class="pillrow">${(fo.visible_to_agents||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")||'<span class="muted">owner only</span>'}</div></div>`:'');
  $("drawer").classList.add("open");}
/* product-artifact viewer — the sim's files are symbolic, so their "content" is the
   capabilities + known gaps + change history + the patch diffs that built them. */
function openArtifact(id){
  const f=frame();const arts=(f.product&&f.product.artifacts)||[];
  const a=arts.find(x=>x.artifact_id===id)||((f.product&&f.product.repo_files)||[]).find(x=>x.artifact_id===id);
  if(!a){return openFile(id);}   // fall back to workspace/company file viewer
  const patches=((f.product&&f.product.patches)||[]).filter(p=>(p.artifact_id||p.target_object_id)===id);
  const meta={path:a.linked_file_path||a.title,type:a.artifact_type,status:a.status,revision:a.revision,
    mainline_revision:a.mainline_revision,awaiting_review:a.awaiting_review,last_reviewed_tick:a.last_reviewed_tick,
    linked_tasks:(a.linked_task_ids||[]).join(", ")||'—'};
  S.reader={title:(a.linked_file_path||a.title||id),
    meta:`${a.artifact_type||''} · rev ${a.revision} · status ${a.status}`, text:_artifactContent(a,patches)};
  let h=`<h3>artifact · <code>${esc(id)}</code></h3><h2 style="margin:4px 0 6px">${esc(a.title||a.linked_file_path||'')}</h2>
    <button class="btn-accent" onclick="openReaderStashed()" style="margin-bottom:8px">▶ View file</button>`;
  h+=`<div class="section"><h3>Meta</h3>${kvBlock(meta)}</div>`;
  if((a.capabilities||[]).length)h+=`<div class="section"><h3>Capabilities (${a.capabilities.length})</h3><div class="pillrow">${a.capabilities.map(c=>`<span class="tag good">${esc(c)}</span>`).join("")}</div></div>`;
  if((a.known_gaps||[]).length)h+=`<div class="section"><h3>Known gaps (${a.known_gaps.length})</h3>${a.known_gaps.map(g=>`<div class="kv muted">• ${esc(g)}</div>`).join("")}</div>`;
  if((a.change_summaries||[]).length)h+=`<div class="section"><h3>Change history (${a.change_summaries.length})</h3>${a.change_summaries.map((s,i)=>`<div class="kv"><b>v${i+1}</b> ${esc(s)}</div>`).join("")}</div>`;
  h+=`<div class="section"><h3>Patches (${patches.length}) — what changed inside</h3>${patches.length?patches.map(p=>{
      const body=p.pseudo_diff||((p.changed_sections||[]).map(s=>`[${s.section}] ${esc(s.before||'')} → ${esc(s.after||'')}`).join("\n"))||'';
      const st=p.status||p.validation_status||'';
      return `<div class="kv" style="border-bottom:1px solid var(--line);padding-bottom:5px"><b>t${p.created_tick!=null?p.created_tick:p.tick} · ${esc(p.patch_type||'')}</b> <span class="tag ${st==='accepted'?'good':'bad'}">${esc(st)}</span><div class="muted" style="font-size:11px">${esc(p.change_summary||p.edit_goal||'')}</div>${body?`<pre style="white-space:pre-wrap;font-size:11px;background:var(--panel2);padding:6px;border-radius:6px;max-height:220px;overflow:auto">${esc(body)}</pre>`:''}</div>`;
    }).join(""):'<div class="muted">no patches recorded for this artifact</div>'}</div>`;
  $("drawerBody").innerHTML=h;$("drawer").classList.add("open");}
/* ---------- Product Terminal (human try / evaluate the product) ---------- */
function renderProductTerminal(f,p){
  S.product=S.product||{};const ps=S.product;
  p.innerHTML=`
  <div class="section"><h3>🧪 Product Terminal — try &amp; evaluate the company's product</h3>
    <div class="muted" style="margin-bottom:8px">Runs the LIVE product at tick ${f.tick} with EXACTLY its current capabilities + limitations.
      Your rating is recorded as a customer signal (feeds the market loop). Use Step / Run on the top bar to evolve the product, then re-run.</div>
    <div class="row">
      <input id="ptQuery" style="flex:1;min-width:340px" placeholder="Ask the product to do something — e.g. 'Research the best open-source vector DB for RAG and cite sources'" value="${esc(ps.query||'')}"/>
      <button class="btn-accent" onclick="productRun()">▶ Run product</button>
    </div>
  </div>
  <div id="ptOut"></div>`;
  if(ps.report!=null)renderProductOut();
}
function renderProductOut(){
  const ps=S.product||{};const prof=ps.profile||{};const out=$("ptOut");if(!out)return;
  out.innerHTML=`
    <div class="section"><h3>Report ${ps.llm===false?'<span class="tag warn">no-LLM stub</span>':''} <span class="muted" style="font-weight:400">· confidence ${ps.confidence!=null?ps.confidence:'—'}</span></h3>
      <pre style="white-space:pre-wrap;font-size:12px;line-height:1.5;background:var(--panel2);padding:10px;border-radius:6px;max-height:420px;overflow:auto">${esc(ps.report||'')}</pre>
      ${(ps.caveats||[]).length?`<div class="kv"><b>caveats</b><div>${ps.caveats.map(c=>`<div class="muted" style="font-size:11px">• ${esc(c)}</div>`).join("")}</div></div>`:''}</div>
    <div class="section"><h3>Product profile @ t${prof.tick!=null?prof.tick:'—'} <span class="muted" style="font-weight:400">· ${esc(prof.name||'')} · ${esc(prof.stage||'')}</span></h3>
      <div class="kv"><b>capabilities</b> <div class="pillrow">${(prof.capabilities||[]).map(c=>`<span class="tag good">${esc(c)}</span>`).join("")||'<span class="muted">minimal</span>'}</div></div>
      <div class="kv"><b>known limitations</b><div>${(prof.known_limitations||[]).map(c=>`<div class="muted" style="font-size:11px">• ${esc(c)}</div>`).join("")||'<span class="muted">none recorded</span>'}</div></div></div>
    <div class="section"><h3>Evaluate this product</h3>
      <div class="row">rating: ${[1,2,3,4,5].map(n=>`<button class="${ps.rating===n?'btn-accent':''}" onclick="setRating(${n})">${n}★</button>`).join("")}</div>
      <input id="ptComment" style="width:100%;margin-top:8px" placeholder="optional feedback — what worked, what didn't, would you pay?" value="${esc(ps.comment||'')}"/>
      <button class="btn-accent" style="margin-top:8px" onclick="productFeedback()">Submit feedback → customer signal</button>
      ${ps.fbMsg?`<div class="tag good" style="margin-top:6px">${esc(ps.fbMsg)}</div>`:''}</div>`;
}
async function productRun(){
  const q=($("ptQuery")||{}).value||"";
  S.product=Object.assign(S.product||{},{query:q,report:"… running the product …",profile:{},caveats:[],confidence:null,fbMsg:""});
  renderProductOut();
  const d=await postJSON("/api/org/product/try",{query:q});
  S.product=Object.assign(S.product||{},{query:q,report:d.report||d.error||"(no output)",
    profile:d.profile||{},caveats:d.caveats||[],confidence:d.confidence,llm:d.llm});
  renderProductOut();
}
function setRating(n){S.product=S.product||{};S.product.comment=($("ptComment")||{}).value||S.product.comment;
  S.product.rating=n;renderProductOut();}
async function productFeedback(){
  const ps=S.product||{};const comment=($("ptComment")||{}).value||ps.comment||"";
  if(!ps.rating&&!comment){S.product.fbMsg="pick a rating or add a comment first";return renderProductOut();}
  const d=await postJSON("/api/org/product/feedback",{rating:ps.rating||0,comment,query:ps.query||""});
  S.product=Object.assign(S.product||{},{comment,
    fbMsg:`✓ recorded ${d.ticket_id} (rating ${d.rating}) at t${d.tick} · human tickets: ${d.total_human_tickets}`});
  renderProductOut();
}

/* ---------- IDE-style file reader ---------- */
const EXT_LANG={py:"python",pyw:"python",js:"javascript",mjs:"javascript",ts:"typescript",tsx:"typescript",
  jsx:"javascript",md:"markdown",markdown:"markdown",json:"json",yaml:"yaml",yml:"yaml",toml:"ini",ini:"ini",
  html:"xml",xml:"xml",css:"css",scss:"scss",sh:"bash",bash:"bash",zsh:"bash",sql:"sql",java:"java",kt:"kotlin",
  go:"go",rs:"rust",c:"c",h:"c",cpp:"cpp",cc:"cpp",hpp:"cpp",rb:"ruby",php:"php",cs:"csharp",swift:"swift",
  txt:"plaintext",log:"plaintext"};
function openReader(title,meta,text){
  text=String(text==null?"":text);
  $("readerTitle").textContent=title||"file";$("readerMeta").textContent=meta||"";
  const n=text.split("\n").length;
  $("readerGutter").textContent=Array.from({length:n},(_,i)=>i+1).join("\n");
  const code=$("readerCode");
  // syntax highlight: file extension -> language, else auto-detect (highlight.js)
  let lang=null;const m=/\.([a-z0-9]+)$/i.exec(title||"");
  if(m&&window.hljs&&EXT_LANG[m[1].toLowerCase()]&&hljs.getLanguage(EXT_LANG[m[1].toLowerCase()]))lang=EXT_LANG[m[1].toLowerCase()];
  if(window.hljs&&text){let res=null;
    try{res=lang?hljs.highlight(text,{language:lang}):hljs.highlightAuto(text);}catch(e){res=null;}
    code.innerHTML=`<code class="hljs">${res?res.value:esc(text)}</code>`;
    $("readerLang").textContent=((res&&res.language)||lang||"text");}
  else{code.textContent=text||"(empty)";$("readerLang").textContent="";}
  $("reader").classList.add("open");}
function closeReader(){$("reader").classList.remove("open");}
function openReaderStashed(){const r=S.reader||{};openReader(r.title,r.meta,r.text);}
function _artifactContent(a,patches){
  const L=[];
  L.push(`# ${a.linked_file_path||a.title||a.artifact_id}`);
  L.push(`# status=${a.status} · revision=${a.revision} · mainline=${a.mainline_revision==null?'-':a.mainline_revision}`);
  L.push("");
  if((a.capabilities||[]).length){L.push('"""');L.push("Capabilities (what this file can do):");
    a.capabilities.forEach(c=>L.push("  - "+c));L.push('"""');L.push("");}
  const applied=(patches||[]).filter(p=>(p.status||p.validation_status)==='accepted');
  if(applied.length){
    L.push("# ===== built from "+applied.length+" applied change(s), oldest first =====");L.push("");
    applied.forEach(p=>{
      L.push(`# --- t${p.created_tick!=null?p.created_tick:p.tick} · ${p.patch_type||'patch'} · ${p.change_summary||p.edit_goal||''}`);
      if(p.pseudo_diff)L.push(p.pseudo_diff);
      (p.changed_sections||[]).forEach(s=>{L.push("["+(s.section||'section')+"]");if(s.after)L.push(s.after);});
      (p.added_fields||[]).forEach(f=>L.push("+ field: "+f));
      (p.added_checks||[]).forEach(f=>L.push("+ check: "+f));
      (p.changed_behavior||[]).forEach(f=>L.push("~ "+f));
      (p.checklist_items||[]).forEach(f=>L.push("- [ ] "+f));
      (p.workflow_sections||[]).forEach(f=>L.push("# "+f));
      L.push("");});
  }else{L.push("# (no applied patches yet — file is a stub / symbolic placeholder)");L.push("");}
  if((a.known_gaps||[]).length){L.push("# TODO — known gaps:");a.known_gaps.forEach(g=>L.push("#   - "+g));}
  return L.join("\n");}
function drawerKV(title,o){$("drawerBody").innerHTML=`<h3>${esc(title)}</h3>${kvBlock(o)}`;$("drawer").classList.add("open");}
function closeDrawer(){$("drawer").classList.remove("open");}

/* ---------- boot ---------- */
loadSources();

[project]
name = "relic"
version = "0.1.0.dev0"
description = "Research code for Relic agent organizations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cooper = [
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "pandas>=2.1",
    "rank-bm25>=0.2.2",
    "together>=1.0",
    "tomli>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
relic = "relic.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relic", "environments"]

[tool.hatch.build.targets.wheel.force-include]
"relic/inspector/static/index.html" = "relic/inspector/static/index.html"
"relic/inspector/static/app.css" = "relic/inspector/static/app.css"
"relic/inspector/static/app.js" = "relic/inspector/static/app.js"
"tools/__init__.py" = "tools/__init__.py"
"tools/run_org_baselines.py" = "tools/run_org_baselines.py"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests",
    "integration: multi-component tests without paid model calls",
    "release: release acceptance checks",
    "slow: opt-in slow tests",
    "live: opt-in tests that may contact external providers",
    "docker: tests requiring Docker",
    "replay: public trace and replay tests",
    "llm: tests that may incur model usage",
    "regression: historical bug regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"environments/**/*.py" = ["E402", "E701", "E702", "E731", "E741", "F401", "F841"]

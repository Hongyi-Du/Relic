schema_version: relic-main-study-v1
study: relic-main-v1

# The paper reports 120 cells per model and 240 main-study runs in total.
models:
  - gpt-5.6-terra
  - claude-opus-4.6
workloads: [w01, w02, w03, w04, w05, w06, w07, w08, w09, w10]
seeds: [1401, 2711, 4013]
arms: [b0, b1, b2, b3]

ticks: 336
checkpoint_every: 24
sprint_ticks: 168
work_rhythm_enabled: false
approval_mode: semi_auto

# The official reproduction entrypoint expands this matrix into 30 paired
# B0--B3 source batches and delegates each batch to the hci baseline runner.
# These ceilings are copied verbatim from the source-runner regular-batch
# guidance; they are not a Relic-local per-cell scheduler policy.
source_runner:
  schema_version: relic-source-runner-v1
  baseline_runner: tools/run_org_baselines.py
  execution_profile: native
  mechanism_ablations: [work_rhythm]
  resource_ceilings:
    max_llm_calls: 6000
    max_llm_requested_tokens: 20000000
    max_llm_prompt_characters: 100000000
    max_primary_actions: 2688
    max_ticks: 336

resource_policy:
  matched_budget: false
  measure_realized_provider_tokens: true

condition_invariants:
  candidate_feature_execution_implementations: shared
  action_registry_and_tool_surface: same
  model_decoding_and_retries: same
  task_visible_information: same
  private_memory_and_appraisal: enabled
  shared_workspace_channels_meetings:
    b0: not_applicable
    b1: enabled
    b2: enabled
    b3: enabled
  persistent_roster_for_whole_run:
    b0: not_applicable
    b1: enabled
    b2: enabled
    b3: enabled

formal_evaluator_policy:
  allowed_backends: [docker, apptainer]
  trust_level: untrusted
  network_enabled: false
  platform: linux/amd64
  digest_pinned_image_required: true
  image_environment_variable: RELIC_EVALUATOR_CONTAINER_IMAGE
  paper_runtime_environment_variable: ORG_EVALUATOR_CONTAINER_IMAGE
  per_run_receipts:
    - execution_policy
    - dataset_manifest_hash
    - starter_repo_digest
    - reference_repo_digest
    - hidden_suite_hash
    - evaluator_environment_hash
    - qualification_plan_hash
    - qualification_result_hash
  note: >-
    The paper retains backend and evaluator-policy provenance per run and does
    not claim one fixed backend or evaluator-environment hash for all 240 runs.

aggregation:
  block: model_x_workload
  average_seeds_within_block: true
  equal_weight_blocks: true
  paired_bootstrap_replicates: 10000
  bootstrap_seed: 1729

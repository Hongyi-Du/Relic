x-relic-paths: &relic-paths
  RELIC_HOME: /app
  RELIC_BENCHMARK_ROOT: /app/benchmarks
  RELIC_OUTPUT_ROOT: /data/outputs
  RELIC_CACHE_ROOT: /data/cache

x-relic-runtime-environment: &relic-runtime-environment
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
  OPENAI_MODEL: "${OPENAI_MODEL:-}"
  RELIC_OPENAI_DEFAULT_HEADERS_JSON: "${RELIC_OPENAI_DEFAULT_HEADERS_JSON:-{}}"
  RELIC_OPENAI_DISABLE_RESPONSE_STORAGE: "${RELIC_OPENAI_DISABLE_RESPONSE_STORAGE:-true}"
  RELIC_RUNTIME_MODEL: "${RELIC_RUNTIME_MODEL:-}"
  ORG_LLM_RUNTIME_MODEL: "${ORG_LLM_RUNTIME_MODEL:-}"
  RELIC_EVALUATOR_MODE: "${RELIC_EVALUATOR_MODE:-local}"
  RELIC_EVALUATOR_STRICT_REPRODUCIBILITY: "${RELIC_EVALUATOR_STRICT_REPRODUCIBILITY:-false}"
  RELIC_EVALUATOR_BACKEND: "${RELIC_EVALUATOR_BACKEND:-}"
  RELIC_EVALUATOR_CONTAINER_IMAGE: "${RELIC_EVALUATOR_CONTAINER_IMAGE:-}"
  RELIC_EVALUATOR_CONTAINER_PLATFORM: "${RELIC_EVALUATOR_CONTAINER_PLATFORM:-}"
  ORG_OSS_QUALIFICATION_TIMEOUT: "${ORG_OSS_QUALIFICATION_TIMEOUT:-180}"
  RELIC_CLAUDE_OPUS_4_6_MODEL: "${RELIC_CLAUDE_OPUS_4_6_MODEL:-}"

x-relic-common: &relic-common
  build:
    context: .
    dockerfile: Dockerfile
  image: relic:local
  init: true
  user: "${RELIC_UID:-1000}:${RELIC_GID:-1000}"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m
  environment: *relic-paths

services:
  relic:
    <<: *relic-common
    environment:
      <<: [*relic-paths, *relic-runtime-environment]
    volumes:
      - ./outputs:/data/outputs
      - ./cache:/data/cache
      - ./traces:/data/traces:ro
    command: ["check-env", "--scope", "core"]

  relic-inspector:
    <<: *relic-common
    profiles: ["inspector"]
    ports:
      - "127.0.0.1:${RELIC_INSPECTOR_PORT:-8765}:8765"
    volumes:
      - ./traces:/data/traces:ro
    command:
      - inspect
      - --trace
      - "/data/traces/${RELIC_TRACE_FILE:-selected-trace.json}"
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --allow-remote
